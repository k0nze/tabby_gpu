input_buffer:
    capacity_bytes: 1024
    bytes_per_word: 4
    clock_freq_hz: 100000000
    read_setup_cycles: 2
    read_cycles_per_word: 2

frame_buffer:
    width: 640
    height: 480
    bytes_per_word: 4
    clock_freq_hz: 100000000
    write_setup_cycles: 2
    write_cycles_per_word: 2
    clear_cycles: 10

command_queue:
    size: 64
    clock_freq_hz: 100000000
    write_setup_cycles: 2
    write_cycles_per_command: 1
    read_setup_cycles: 2
    read_cycles_per_command: 1

command_processor:
    clock_freq_hz: 100000000
    decode_cycles: 2

triangle_rasterizer:
    scanline_fifo_capacity_bytes: 7680
    clock_freq_hz: 100000000
    setup_cycles: 2
    pipeline_latency_cycles: 80
    pixel_input_interval_cycles: 1
