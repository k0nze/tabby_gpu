repos:
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v18.1.8
      hooks:
          - id: clang-format
            types_or: [c, c++]
    - repo: local
      hooks:
          - id: prettier-yaml
            name: Format YAML (4-space indentation)
            entry: prettier --write --tab-width 4 --use-tabs false
            language: node
            additional_dependencies: [prettier@3.6.2]
            types: [yaml]
          - id: cmake-format
            name: Format CMake files
            entry: cmake-format --in-place
            language: python
            additional_dependencies: [cmakelang==0.6.13]
            types: [cmake]
